                  - nombre
                  type: object
                type: array
            required:
            - imagen
            - puerto
            type: object
          status:
            description: K8FlowAppStatus defines the observed state of K8FlowApp
            properties:
              phase:
                type: string
              replicas:
                type: string
              replicasListas:
                format: int32
                type: integer
              replicasDeseadas:
                format: int32
                type: integer
              revisionActual:
                format: int32
                type: integer
              url:
                type: string
              mensaje:
                type: string
              ultimaReconciliacion:
                format: date-time
                type: string
              condiciones:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              recursosCreados:
                properties:
                  deployment:
                    type: string
                  service:
                    type: string
                  ingress:
                    type: string
                  configMap:
                    type: string
                  secret:
                    type: string
                  hpa:
                    type: string
