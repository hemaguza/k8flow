---
apiVersion: v1
kind: Namespace
metadata:
  name: k8flow-system
  labels:
    app.kubernetes.io/name: k8flow
    app.kubernetes.io/part-of: k8flow-platform

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8flow-admin-sa
  namespace: k8flow-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8flow-admin-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8flow-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8flow-admin-role
subjects:
  - kind: ServiceAccount
    name: k8flow-admin-sa
    namespace: k8flow-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8flow-operator
  namespace: k8flow-system
  labels:
    app: k8flow-operator
    app.kubernetes.io/name: k8flow-operator
    app.kubernetes.io/part-of: k8flow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8flow-operator
  template:
    metadata:
      labels:
        app: k8flow-operator
    spec:
      serviceAccountName: k8flow-admin-sa
      containers:
        - name: manager
          image: ghcr.io/hemaguza/k8flow-operator:v1.0.5
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8flow-api
  namespace: k8flow-system
  labels:
    app: k8flow-api
    app.kubernetes.io/name: k8flow-api
    app.kubernetes.io/part-of: k8flow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8flow-api
  template:
    metadata:
      labels:
        app: k8flow-api
    spec:
      serviceAccountName: k8flow-admin-sa
      containers:
        - name: api
          image: ghcr.io/hemaguza/k8flow-api:v1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: k8flow-api
  namespace: k8flow-system
  labels:
    app: k8flow-api
spec:
  type: ClusterIP
  selector:
    app: k8flow-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8flow-console
  namespace: k8flow-system
  labels:
    app: k8flow-console
    app.kubernetes.io/name: k8flow-console
    app.kubernetes.io/part-of: k8flow-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8flow-console
  template:
    metadata:
      labels:
        app: k8flow-console
    spec:
      containers:
        - name: console
          image: ghcr.io/hemaguza/k8flow-console:v1.0.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: k8flow-console
  namespace: k8flow-system
  labels:
    app: k8flow-console
spec:
  type: NodePort
  selector:
    app: k8flow-console
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
