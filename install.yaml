apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: k8flowapps.k8flow.io
spec:
  group: k8flow.io
  names:
    kind: K8FlowApp
    listKind: K8FlowAppList
    plural: k8flowapps
    singular: k8flowapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Estado
      type: string
    - jsonPath: .status.replicas
      name: Replicas
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Edad
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: K8FlowApp is the Schema for the k8flowapps API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: K8FlowAppSpec defines the desired state of K8FlowApp
            properties:
              imagen:
                type: string
              replicas:
                format: int32
                minimum: 0
                type: integer
              puerto:
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              comando:
                items:
                  type: string
                type: array
              argumentos:
                items:
                  type: string
                type: array
              configMapsRefs:
                items:
                  type: string
                type: array
              secretsRefs:
                items:
                  type: string
                type: array
              politicaReinicio:
                enum:
                - Always
                - OnFailure
                - Never
                type: string
              estrategia:
                enum:
                - RollingUpdate
                - Recreate
                type: string
              variables:
                items:
                  properties:
                    nombre:
                      type: string
                    valor:
                      type: string
                    secretRef:
                      properties:
                        nombre:
                          type: string
                        clave:
                          type: string
                      required:
                      - clave
                      - nombre
                      type: object
                    configMapRef:
                      properties:
                        nombre:
                          type: string
                        clave:
                          type: string
                      required:
                      - clave
                      - nombre
                      type: object
                  required:
                  - nombre
                  type: object
                type: array
              recursos:
                properties:
                  cpuRequest:
                    type: string
                  cpuLimit:
                    type: string
                  memoriaRequest:
                    type: string
                  memoriaLimit:
                    type: string
                type: object
              liveness:
                properties:
                  path:
                    type: string
                  puerto:
                    format: int32
                    type: integer
                  periodoInicialSeg:
                    format: int32
                    type: integer
                  periodoSeg:
                    format: int32
                    type: integer
                  timeoutSeg:
                    format: int32
                    type: integer
                  fallosPermitidos:
                    format: int32
                    type: integer
                type: object
              readiness:
                properties:
                  path:
                    type: string
                  puerto:
                    format: int32
                    type: integer
                  periodoInicialSeg:
                    format: int32
                    type: integer
                  periodoSeg:
                    format: int32
                    type: integer
                  timeoutSeg:
                    format: int32
                    type: integer
                  fallosPermitidos:
                    format: int32
                    type: integer
                type: object
              exposicion:
                properties:
                  tipo:
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                  puerto:
                    format: int32
                    type: integer
                  host:
                    type: string
                  path:
                    type: string
                  tlsSecret:
                    type: string
                type: object
              autoscaling:
                properties:
                  minReplicas:
                    format: int32
                    minimum: 1
                    type: integer
                  maxReplicas:
                    format: int32
                    minimum: 1
                    type: integer
                  targetCPU:
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  targetMemoria:
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                required:
                - maxReplicas
                - minReplicas
                type: object
              volumenes:
                items:
                  properties:
                    nombre:
                      type: string
                    montaje:
                      type: string
                    tamano:
                      type: string
                    storageClass:
                      type: string
                  required:
                  - montaje
                  - nombre
                  - tamano
                  type: object
                type: array
              sidecars:
                items:
                  properties:
                    nombre:
                      type: string
                    imagen:
                      type: string
                    puerto:
